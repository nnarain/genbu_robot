name: Build ROS Packages

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: ros_ws/src/genbu_robot

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: v0.81.0
          manifest-path: ros_ws/src/genbu_robot/ci/ros-build/pixi.toml
          cache: true
          run-install: true
          locked: true

      - name: Import external repositories
        run: |
          pixi run --manifest-path "$PIXI_MANIFEST" \
            vcs import "$ROS_WS/src" < "$ROS_WS/src/genbu_robot/genbu_robot.repos"

      - name: Build and install YDLidar SDK
        run: |
          pixi run --manifest-path "$PIXI_MANIFEST" \
            bash -euo pipefail -c '
              cmake -S "$ROS_WS/src/YDLIDAR/YDLidar-SDK" -B /tmp/ydlidar-sdk-build \
                -G Ninja -DCMAKE_INSTALL_PREFIX="$CONDA_PREFIX"
              cmake --build /tmp/ydlidar-sdk-build --parallel
              cmake --install /tmp/ydlidar-sdk-build
            '

      - name: Build workspace
        run: |
          pixi run --manifest-path "$PIXI_MANIFEST" \
            bash -euo pipefail -c '
              cd "$ROS_WS"
              export LIBRARY_PATH="$CONDA_PREFIX/lib:${LIBRARY_PATH:-}"
              colcon build --cmake-args \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$CONDA_PREFIX:${CMAKE_PREFIX_PATH:-}"
            '
    env:
      PIXI_MANIFEST: ${{ github.workspace }}/ros_ws/src/genbu_robot/ci/ros-build/pixi.toml
      ROS_WS: ${{ github.workspace }}/ros_ws
