name: Build ROS Packages

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ros:${{ matrix.ros_distro }}
    strategy:
      matrix:
        ros_distro: [jazzy]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-vcstool \
            python3-rosdep \
            build-essential \
            rsync

      - name: Import external repositories
        run: |
          mkdir -p /ros_ws/src
          vcs import /ros_ws/src < genbu_robot.repos

      - name: Copy local packages to workspace
        run: rsync -a --exclude='.git' --exclude='.github' . /ros_ws/src/genbu_robot/

      - name: Install rosdep dependencies
        run: |
          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then rosdep init; fi
          rosdep update
          cd /ros_ws
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build workspace
        run: |
          cd /ros_ws
          . /opt/ros/${{ matrix.ros_distro }}/setup.sh
          colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release
