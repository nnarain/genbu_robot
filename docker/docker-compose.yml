services:
  genbu-hardware:
    image: ${GENBU_IMAGE:-ghcr.io/nnarain/genbu_robot:latest}
    container_name: genbu-hardware
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    privileged: true
    volumes:
      - /dev:/dev
    command: >
      /bin/bash -lc "source /opt/ros/$${ROS_DISTRO}/setup.bash &&
      export COLCON_CURRENT_PREFIX=/ros_ws/install &&
      source /ros_ws/install/setup.bash &&
      ros2 launch genbu_bringup hardware.launch.xml"

  genbu-navigation:
    image: ${GENBU_IMAGE:-ghcr.io/nnarain/genbu_robot:latest}
    container_name: genbu-navigation
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    command: >
      /bin/bash -lc "source /opt/ros/$${ROS_DISTRO}/setup.bash &&
      export COLCON_CURRENT_PREFIX=/ros_ws/install &&
      source /ros_ws/install/setup.bash &&
      ros2 launch genbu_bringup navigation.launch.xml"
    depends_on:
      - genbu-hardware

  genbu-web:
    image: ${GENBU_IMAGE:-ghcr.io/nnarain/genbu_robot:latest}
    container_name: genbu-web
    network_mode: host
    ipc: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - ENABLE_FOXGLOVE=${ENABLE_FOXGLOVE:-true}
      - ENABLE_MEDKIT=${ENABLE_MEDKIT:-true}
    command: >
      /bin/bash -lc "source /opt/ros/$${ROS_DISTRO}/setup.bash &&
      export COLCON_CURRENT_PREFIX=/ros_ws/install &&
      source /ros_ws/install/setup.bash &&
      ros2 launch genbu_web web.launch.xml"
    depends_on:
      - genbu-hardware
      - genbu-navigation
    ports:
      # Foxglove Studio
      - "8765:8765"
