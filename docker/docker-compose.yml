services:
  genbu:
    image: genbu_robot:latest
    # Grant access to all host devices so new hardware (e.g. sensors, serial
    # adapters) can be used without modifying this file.
    # NOTE: privileged mode and the /dev volume mount significantly broaden the
    # container's access to the host.  Only run this on a trusted robot host.
    privileged: true
    # host networking is required for ROS 2 DDS discovery across the robot's
    # local network.
    network_mode: host
    volumes:
      - /dev:/dev
