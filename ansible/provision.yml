---
- name: Provision Raspberry Pi for Genbu Robot
  hosts: all
  become: true

  tasks:
    # --- Genbu Robot Debian package ---

    - name: Install genbu-robot Debian package
      ansible.builtin.import_tasks: tasks/install_genbu_robot.yml

    # --- Swap ---

    - name: Disable swap
      ansible.builtin.import_tasks: tasks/disable_swap.yml

    # --- Netplan auto-recovery ---

    - name: Set up Netplan auto-recovery service
      ansible.builtin.import_tasks: tasks/setup_netplan_recovery.yml
